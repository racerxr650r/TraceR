name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/vscode-project-xml/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system prerequisites (CI)
        run: make -C tools prereqs-ci

      - name: Bootstrap (venv + npm deps)
        run: make -C tools bootstrap

      - name: Run all CI checks
        # lint, validate-xml, render, test-py, ext-test-unit,
        # ext-test-ui, ext-typecheck, ext-build
        run: make -C tools ci

      - name: Run tests with JUnit reporting
        if: always()
        run: |
          make -C tools test-py-junit
          make -C tools ext-test-unit-junit
          make -C tools test_report

      - name: Test results in job log
        if: always()
        run: cat test_reports/test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post test results to PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-results
          path: test_reports/test-report.md

      - name: Run coverage (Python + extension)
        run: |
          make -C tools coverage
          make -C tools ext-coverage
          make -C tools coverage_report

      - name: Coverage summary in job log
        run: cat test_reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: test_reports/report.md
