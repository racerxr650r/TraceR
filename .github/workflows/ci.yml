name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/vscode-project-xml/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system prerequisites (CI)
        run: make -C tools prereqs-ci

      - name: Bootstrap (venv + npm deps)
        run: make -C tools bootstrap

      - name: Run all CI checks
        # lint, validate-xml, render, test-py, ext-test-unit,
        # ext-test-ui, ext-typecheck, ext-build
        run: make -C tools ci
